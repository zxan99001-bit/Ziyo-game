<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZIYO COIN</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(160deg, #0d1728, #1b3155);
      color: white;
    }

    .game {
      max-width: 430px;
      margin: auto;
      padding: 22px 16px 35px;
      text-align: center;
    }

    h1 {
      margin: 5px 0 20px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .box {
      background: rgba(255,255,255,.1);
      padding: 12px 5px;
      border-radius: 14px;
    }

    .num {
      display: block;
      margin-top: 5px;
      font-size: 20px;
      font-weight: bold;
    }

    #coin {
      width: 210px;
      height: 210px;
      margin: 30px auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 75px;
      background: radial-gradient(circle at 35% 30%, #fff19b, #ffb300 48%, #d57900);
      border: 8px solid #ffd75a;
      box-shadow: 0 0 35px rgba(255,190,40,.5);
      cursor: pointer;
      transition: transform .08s;
    }

    #coin:active {
      transform: scale(.9);
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: 0;
      border-radius: 13px;
      background: #279bea;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .section {
      margin-top: 20px;
      text-align: left;
    }

    .section h2 {
      font-size: 20px;
    }

    .achievement {
      background: rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 13px;
      margin: 8px 0;
    }

    .locked {
      opacity: .45;
    }

    .progress {
      height: 7px;
      background: #34445c;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .progress div {
      height: 100%;
      background: #ffd23f;
      width: 0%;
    }

    #message {
      min-height: 25px;
      margin-top: 12px;
      color: #ffd75a;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🪙 ZIYO COIN</h1>

  <div class="stats">
    <div class="box">
      🪙 Coin
      <span id="score" class="num">0</span>
    </div>

    <div class="box">
      ⭐ Level
      <span id="level" class="num">1</span>
    </div>

    <div class="box">
      🔥 Streak
      <span id="streak" class="num">0</span>
    </div>
  </div>

  <div id="coin">🪙</div>

  <button id="bonus">🎁 Kunlik bonus</button>

  <div id="message"></div>

  <div class="section">
    <h2>🏆 Yutuqlar</h2>

    <div id="achievements"></div>
  </div>

</div>

<script>
  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }

  let score = Number(localStorage.getItem("ziyo_score")) || 0;
  let level = Number(localStorage.getItem("ziyo_level")) || 1;
  let streak = Number(localStorage.getItem("ziyo_streak")) || 0;

  let lastLogin = localStorage.getItem("ziyo_last_login") || "";
  let lastBonus = localStorage.getItem("ziyo_last_bonus") || "";

  const scoreEl = document.getElementById("score");
  const levelEl = document.getElementById("level");
  const streakEl = document.getElementById("streak");
  const coin = document.getElementById("coin");
  const bonus = document.getElementById("bonus");
  const message = document.getElementById("message");
  const achievementsEl = document.getElementById("achievements");

  function today() {
    const d = new Date();

    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function yesterday() {
    const d = new Date();
    d.setDate(d.getDate() - 1);

    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  function save() {
    localStorage.setItem("ziyo_score", score);
    localStorage.setItem("ziyo_level", level);
    localStorage.setItem("ziyo_streak", streak);
    localStorage.setItem("ziyo_last_login", lastLogin);
    localStorage.setItem("ziyo_last_bonus", lastBonus);
  }

  function updateStreak() {
    const t = today();

    if (lastLogin === t) {
      return;
    }

    if (lastLogin === yesterday()) {
      streak++;
    } else {
      streak = 1;
    }

    lastLogin = t;
    save();
  }

  function update() {
    scoreEl.textContent = score;
    levelEl.textContent = level;
    streakEl.textContent = streak;

    save();
    renderAchievements();
  }

  const achievements = [
    {
      id: "first",
      icon: "🥉",
      name: "Birinchi coin",
      description: "1 ta coin yig‘ish",
      target: 1,
      reward: 10
    },
    {
      id: "hundred",
      icon: "🥈",
      name: "100 Coin",
      description: "100 ta coin yig‘ish",
      target: 100,
      reward: 50
    },
    {
      id: "thousand",
      icon: "🥇",
      name: "1000 Coin",
      description: "1000 ta coin yig‘ish",
      target: 1000,
      reward: 200
    },
    {
      id: "tenk",
      icon: "🏆",
      name: "Coin Master",
      description: "10 000 ta coin yig‘ish",
      target: 10000,
      reward: 1000
    }
  ];

  function isCompleted(id) {
    return localStorage.getItem("achievement_" + id) === "1";
  }

  function completeAchievement(a) {
    if (isCompleted(a.id)) return;

    if (score >= a.target) {
      localStorage.setItem("achievement_" + a.id, "1");

      score += a.reward;

      message.textContent =
        "🏆 " + a.name + "! +" + a.reward + " coin";
    }
  }

  function renderAchievements() {
    achievementsEl.innerHTML = "";

    achievements.forEach(a => {
      completeAchievement(a);

      const completed = isCompleted(a.id);

      const percent = Math.min(
        100,
        Math.floor((score / a.target) * 100)
      );

      const div = document.createElement("div");

      div.className =
        "achievement " + (completed ? "" : "locked");

      div.innerHTML = `
        <div>
          ${a.icon} <b>${a.name}</b>
        </div>

        <small>
          ${completed
            ? "✅ Bajarildi"
            : a.description + " • Mukofot: +" + a.reward}
        </small>

        <div class="progress">
          <div style="width:${completed ? 100 : percent}%"></div>
        </div>
      `;

      achievementsEl.appendChild(div);
    });

    save();
  }

  coin.addEventListener("click", () => {
    score += level;

    if (score >= level * 100) {
      level++;
      message.textContent = "🎉 Yangi level: " + level;
    } else {
      message.textContent = "+" + level + " 🪙";
    }

    update();
  });

  bonus.addEventListener("click", () => {
    const t = today();

    if (lastBonus === t) {
      message.textContent = "⏳ Bugungi bonusni oldingiz!";
      return;
    }

    const reward = 100 + (streak * 20);

    score += reward;
    lastBonus = t;

    message.textContent =
      "🎁 Bonus: +" + reward + " 🪙";

    save();
    update();
  });

  updateStreak();
  update();

</script>

</body>
</html>
