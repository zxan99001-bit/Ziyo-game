<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ziyo Game</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:white;
    background:linear-gradient(135deg,#07111f,#12345a);
}

.container{
    max-width:450px;
    margin:auto;
    padding:20px;
    text-align:center;
}

h1{margin:5px 0}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin:20px 0;
}

.box{
    background:rgba(255,255,255,.1);
    padding:15px;
    border-radius:16px;
}

.number{
    font-size:25px;
    font-weight:bold;
}

.coin{
    width:190px;
    height:190px;
    border-radius:50%;
    border:0;
    background:#f5b800;
    font-size:90px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transition:.08s;
}

.coin:active{
    transform:scale(.88);
}

.progress{
    height:14px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
    margin:10px 0 20px;
}

#progress{
    height:100%;
    width:0%;
    background:#ffd43b;
    transition:.2s;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:13px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.shop{
    display:none;
    margin-top:20px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.1);
    padding:14px;
    margin:9px 0;
    border-radius:15px;
    text-align:left;
}

.item button{
    border:0;
    border-radius:10px;
    padding:10px;
    font-weight:bold;
}

.small{
    opacity:.8;
    font-size:13px;
}

#message{
    min-height:22px;
    margin:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🪙 ZIYO GAME</h1>
<p>Coin yig‘ing va kiyimlarni oching!</p>

<div class="stats">

<div class="box">
🪙 COIN
<div class="number" id="coins">0</div>
</div>

<div class="box">
⭐ LEVEL
<div class="number" id="level">1</div>
</div>

</div>

<p>
Keyingi level: <b id="next">100</b> 🪙
</p>

<div class="progress">
<div id="progress"></div>
</div>

<button class="coin" id="coinButton">🪙</button>

<p>
Bosishga bonus: <b id="power">1</b> 🪙
</p>

<div id="message"></div>

<button class="btn" onclick="openShop()">
👕 KIYIMLAR DO‘KONI
</button>

<button class="btn" onclick="dailyBonus()">
🎁 KUNLIK BONUS
</button>

<div class="shop" id="shop">

<h2>👕 Kiyimlar</h2>

<div id="items"></div>

</div>

</div>

<script>

/* =========================
   SAQLASH
========================= */

let coins = Number(localStorage.getItem("ziyo_coins")) || 0;
let level = Number(localStorage.getItem("ziyo_level")) || 1;
let power = Number(localStorage.getItem("ziyo_power")) || 1;

let clothes =
JSON.parse(localStorage.getItem("ziyo_clothes") || "[]");


/* =========================
   KIYIMLAR
========================= */

const items = [

{
 id:"shirt",
 name:"👕 Oddiy kiyim",
 price:1000,
 bonus:1
},

{
 id:"jacket",
 name:"🧥 Rare kiyim",
 price:5000,
 bonus:3
},

{
 id:"ninja",
 name:"🥷 Ninja kiyim",
 price:25000,
 bonus:7
},

{
 id:"king",
 name:"👑 King kiyim",
 price:100000,
 bonus:20
},

{
 id:"legend",
 name:"🔥 Legendary kiyim",
 price:500000,
 bonus:50
}

];


/* =========================
   LEVEL TALABI
========================= */

function levelRequirement(){

return level * level * 100;

}


/* =========================
   SAQLASH
========================= */

function save(){

localStorage.setItem("ziyo_coins",coins);
localStorage.setItem("ziyo_level",level);
localStorage.setItem("ziyo_power",power);
localStorage.setItem(
"ziyo_clothes",
JSON.stringify(clothes)
);

}


/* =========================
   EKRANNI YANGILASH
========================= */

function update(){

document.getElementById("coins").textContent =
coins.toLocaleString();

document.getElementById("level").textContent =
level;

document.getElementById("power").textContent =
power;

let requirement = levelRequirement();

document.getElementById("next").textContent =
requirement.toLocaleString();

let previous =
(level - 1) * (level - 1) * 100;

let current = coins - previous;

let needed = requirement - previous;

let percent = (current / needed) * 100;

if(percent < 0) percent = 0;
if(percent > 100) percent = 100;

document.getElementById("progress").style.width =
percent + "%";

}


/* =========================
   COIN BOSISH
========================= */

document
.getElementById("coinButton")
.addEventListener("click",function(){

coins += power;

checkLevel();

save();
update();

});


/* =========================
   LEVEL
========================= */

function checkLevel(){

while(coins >= levelRequirement()){

level++;

power++;

showMessage(
"🎉 Level "+level+
" ga chiqdingiz! Bonus: +1 coin"
);

}

}


/* =========================
   XABAR
========================= */

function showMessage(text){

document.getElementById("message").textContent =
text;

setTimeout(function(){

document.getElementById("message").textContent =
"";

},2000);

}


/* =========================
   SHOP
========================= */

function openShop(){

let shop =
document.getElementById("shop");

if(shop.style.display === "block"){

shop.style.display = "none";

}else{

shop.style.display = "block";

renderShop();

}

}


/* =========================
   SHOPNI CHIQARISH
========================= */

function renderShop(){

let box =
document.getElementById("items");

box.innerHTML = "";

items.forEach(function(item){

let bought =
clothes.includes(item.id);

let div =
document.createElement("div");

div.className = "item";

div.innerHTML = `

<div>

<b>${item.name}</b>

<div class="small">
Narxi: ${item.price.toLocaleString()} 🪙
</div>

<div class="small">
Bonus: +${item.bonus} 🪙 / bosish
</div>

</div>

<button
onclick="buyItem('${item.id}')"
${bought ? "disabled" : ""}>

${bought ? "✅ OLINGAN" : "🛒 OLISH"}

</button>

`;

box.appendChild(div);

});

}


/* =========================
   KIYIM SOTIB OLISH
========================= */

function buyItem(id){

let item =
items.find(function(x){

return x.id === id;

});

if(!item) return;

if(clothes.includes(id)){

showMessage("Bu kiyim sizda bor!");

return;

}

if(coins < item.price){

showMessage("❌ Coin yetarli emas!");

return;

}

coins -= item.price;

clothes.push(id);

power += item.bonus;

save();
update();
renderShop();

showMessage(
"🎉 "+item.name+" olindi!"
);

}


/* =========================
   KUNLIK BONUS
========================= */

function dailyBonus(){

let today =
new Date().toISOString().slice(0,10);

let last =
localStorage.getItem("ziyo_daily");

if(last === today){

showMessage(
"⏳ Bugungi bonusni oldingiz!"
);

return;

}

let reward =
100 + (level * 50);

coins += reward;

localStorage.setItem(
"ziyo_daily",
today
);

checkLevel();

save();
update();

showMessage(
"🎁 +"+reward+" coin oldingiz!"
);

}


/* =========================
   BOSHLASH
========================= */

update();

</script>

</body>
</html>
