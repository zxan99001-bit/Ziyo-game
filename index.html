<!-- Mini App Do'kon Bo'limi (HTML) -->
<div class="shop-container">
  <h3>Obunachi ko'paytirish</h3>
  
  <select id="serviceType">
    <option value="telegram_subscribers">Telegram Obunachi (100 obunachi = 10,000 coin)</option>
    <option value="instagram_followers">Instagram Obunachi (100 obunachi = 15,000 coin)</option>
  </select>

  <input type="text" id="targetLink" placeholder="Kanal yoki Profil havolasi (https://...)" />
  <input type="number" id="quantity" placeholder="Soni (Kamida 100)" min="100" />

  <button onclick="sendOrder()">Buyurtma Berish</button>
</div>

<script>
async function sendOrder() {
  const serviceType = document.getElementById('serviceType').value;
  const targetLink = document.getElementById('targetLink').value;
  const quantity = parseInt(document.getElementById('quantity').value);

  if (!targetLink || !quantity) {
    alert("Iltimos, barcha maydonlarni to'ldiring!");
    return;
  }

  const response = await fetch('/api/order', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      userId: window.Telegram.WebApp.initDataUnsafe.user.id,
      serviceType,
      targetLink,
      quantity
    })
  });

  const result = await response.json();
  if (result.success) {
    alert("Buyurtmangiz qabul qilindi! Buyurtma ID: " + result.orderId);
  } else {
    alert("Xatolik: " + result.error);
  }
}
</script>
